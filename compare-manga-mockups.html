<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>限定漫画モックアップ｜2案比較</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#171116;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    header{position:sticky;z-index:10;top:0;padding:16px 20px;background:#171116ee;border-bottom:1px solid #ffffff24;text-align:center;backdrop-filter:blur(12px)}
    h1{margin:0;font-size:clamp(19px,3vw,28px)}
    header p{margin:7px 0 0;color:#d7bdca;font-size:13px;line-height:1.5}
    .compare{display:grid;grid-template-columns:repeat(2,minmax(0,660px));justify-content:center;gap:24px;padding:24px}
    article{min-width:0}
    h2{margin:0 0 12px;padding:12px 16px;border-radius:12px;background:#2a2026;font-size:18px;text-align:center}
    h2 span{display:block;margin-top:4px;color:#eeb4cf;font-size:12px;font-weight:700}
    iframe{display:block;width:100%;height:1500px;border:0;border-radius:12px;background:#fff;box-shadow:0 20px 50px #0008}
    @media(max-width:1000px){.compare{grid-template-columns:minmax(0,660px);padding:14px}.compare article+article{margin-top:20px}iframe{height:1450px}}
  </style>
</head>
<body>
  <header>
    <h1>限定漫画モックアップ 2案比較</h1>
    <p>どちらも実際の限定漫画を使用。画面の中に固有の商品名は出していません。</p>
  </header>
  <main class="compare">
    <article>
      <h2>案1：実際の漫画を3枚<span>内容のチラ見せを最優先</span></h2>
      <iframe src="variant-1-three-pages.html#gift-cta" title="案1 実際の漫画3枚"></iframe>
    </article>
    <article>
      <h2>案2：表紙＋実際の漫画を2枚<span>特典らしさとチラ見せを両立</span></h2>
      <iframe src="variant-2-cover-two-pages.html#gift-cta" title="案2 表紙と実際の漫画2枚"></iframe>
    </article>
  </main>
</body>
</html>
